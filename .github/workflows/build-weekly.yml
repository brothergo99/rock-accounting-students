name: 自動更新 weekly.json

# 觸發條件：只要 goodbook/ 資料夾有任何檔案被新增或修改就執行
on:
  push:
    branches: [main]
    paths:
      - 'goodbook/**'
      - 'overrides.json'
  workflow_dispatch: {}   # 也可以在 Actions 頁面手動按一次

permissions:
  contents: write          # 讓機器人有權限 commit weekly.json 回 repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整 git 歷史來推算每個檔案的年份

      - name: 產生 weekly.json
        run: python3 scripts/build_weekly.py

      - name: Commit 回 repo
        run: |
          git config user.name "weekly-bot"
          git config user.email "actions@github.com"
          git add weekly.json
          # 沒有變更就安靜結束，不要製造空 commit
          git diff --cached --quiet && echo "weekly.json 無變更" && exit 0
          git commit -m "bot: 自動更新 weekly.json"
          git push
